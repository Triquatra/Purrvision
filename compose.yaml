x-api-common: &api-common
  build: .
  image: purrvision
  depends_on:
    - postgres

x-api-env: &api-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: bookingdb
  DB_USER: bookinguser
  DB_PASSWORD: bookingpassword

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bookinguser
      POSTGRES_PASSWORD: bookingpassword
      POSTGRES_DB: bookingdb
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql


  api1:
    <<: *api-common
    environment:
      <<: *api-env
      INSTANCE_NAME: api-1
    ports:
      - "3000:3000"


  api2:
    <<: *api-common
    environment:
      <<: *api-env
      INSTANCE_NAME: api-2
    ports:
      - "3001:3000"


  api3:
    <<: *api-common
    environment:
      <<: *api-env
      INSTANCE_NAME: api-3
    ports:
      - "3002:3000"

  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2
      - api3
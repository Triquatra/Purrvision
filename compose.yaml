services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bookinguser
      POSTGRES_PASSWORD: bookingpassword
      POSTGRES_DB: bookingdb
    ports:
      - "5432:5432"

  api1:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookingdb
      DB_USER: bookinguser
      DB_PASSWORD: bookingpassword
      INSTANCE_NAME: api-1
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  api2:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookingdb
      DB_USER: bookinguser
      DB_PASSWORD: bookingpassword
      INSTANCE_NAME: api-2
    ports:
       - "3001:3000"
    depends_on:
      - postgres

  api3:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookingdb
      DB_USER: bookinguser
      DB_PASSWORD: bookingpassword
      INSTANCE_NAME: api-3
    ports:
      - "3002:3000"
    depends_on:
      - postgres